version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: domtrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: domtrace
      POSTGRES_PASSWORD: password
      POSTGRES_DB: domtrace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domtrace']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domtrace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Opcional: Redis Commander para inspeccionar colas BullMQ en local
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: domtrace-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
