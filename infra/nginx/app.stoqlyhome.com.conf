# Nginx — reverse proxy para el panel web (Vite/React servido por Nginx en contenedor :8080)
#
# Instalar en el host:
#   sudo cp app.stoqlyhome.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/app.stoqlyhome.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.stoqlyhome.com
#
server {
    listen 80;
    server_name app.stoqlyhome.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
