# Nginx — reverse proxy para la API (Fastify, contenedor Docker en :3000)
#
# Instalar en el host:
#   sudo cp api.stoqlyhome.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.stoqlyhome.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.stoqlyhome.com
#
server {
    listen 80;
    server_name api.stoqlyhome.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
